
services:
  - type: web
    name: mass-ia-recomendador
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn recomendador_mass:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: MODELS_DIR
        value: modelos        
      - key: PYTHON_VERSION
        value: 3.11.0
services:
  - type: web
    name: mass-ia-recomendador
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn recomendador_mass:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: SPRINGBOOT_URL
        value: https://ihm-back-220x.onrender.com
      - key: MODELS_DIR
        value: /tmp/modelos
      - key: PYTHON_VERSION
        value: 3.11.0